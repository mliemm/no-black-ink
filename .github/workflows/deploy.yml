name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: mliemm/kit/.github/workflows/deploy-pages.yml@v0.21.0
    with:
      project: no-black-ink
      output_directory: dist
    secrets: inherit
